[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

# `cargo test` works. It previously failed to COMPILE — soroban-env-host
# 22.1.3 declares `ed25519-dalek = ">=2.0.0"`, so cargo resolved 3.0.0, but
# its own testutils calls SigningKey::generate() against trait bounds only
# the 2.x line satisfies. The fix is a cap in the contract's dev-dependencies
# plus a pinned lockfile entry, since that open-ended requirement is
# satisfied by 2.2.0 just as well. Correctness is also proven end-to-end on
# testnet — see ../../DEPLOYMENTS.md.

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
