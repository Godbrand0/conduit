# Pin transitive dependencies with known advisories that their parents
# (mainly @trezor/connect, via @creit.tech/stellar-wallets-kit) have not
# yet updated: protobufjs arbitrary code execution, sharp/libheif.
overrides:
  protobufjs: '>=7.5.5'
  sharp: '>=0.35.4'

allowBuilds:
  '@reown/appkit': set this to true or false
  '@stellar/stellar-sdk': set this to true or false
  blake-hash: set this to true or false
  bufferutil: set this to true or false
  protobufjs: set this to true or false
  secp256k1: set this to true or false
  sharp: set this to true or false
  tiny-secp256k1: set this to true or false
  usb: set this to true or false
  utf-8-validate: set this to true or false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@cctp-sdk/core@0.2.0'
